name: Jianzao original-WAV render
on:
  workflow_dispatch:
    inputs:
      mode:
        description: smoke first; production after review
        default: smoke
        type: choice
        options: [smoke, production]
        required: true
permissions:
  contents: write
concurrency:
  group: jianzao-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
      - uses: actions/checkout@v4
        with:
          repository: hypit-ai/hypit
          ref: dc2b7a8f31b1ef1443a79ca448548d69e3ceb6a0
          path: engine
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare approved source and system fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          fc-list :lang=zh | head -5
          google-chrome --version
          cp -R project/hypit/packages/jianzao-scene engine/examples/semantic-composition/packages/scene
          cd engine
          pnpm install --no-frozen-lockfile
          pnpm build:public-types
          pnpm --filter @jianzao/scene build
      - name: Render with original WAV and verify encoded pixels and audio
        env:
          RENDER_MODE: ${{ inputs.mode }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 project/cloud_render.py
      - name: Failure diagnostics (no media upload)
        if: failure()
        run: |
          for f in project/output/build.log project/output/cloud-audit.json project/output/media-check.json; do
            if test -f "$f"; then tail -100 "$f"; fi
          done
